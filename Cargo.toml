[package]
name = "narrator-validator"
version = "0.20.1"
edition = "2021"
rust-version = "1.80"
description = "Shared semantic validator for Narrator story repositories"
license = "MIT"
repository = "https://github.com/phurley/narrator-validator"
documentation = "https://docs.rs/narrator-validator"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "narrator-validator"
path = "src/main.rs"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
wasm-bindgen = { version = "=0.2.100", optional = true }
# serde_yaml's indexmap range otherwise resolves to an edition-2024 release
# that Cargo 1.80 cannot parse. Keep the validator aligned with the backend's
# declared MSRV until both projects intentionally upgrade.
indexmap = "=2.11.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
