name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WASM_BINDGEN_VERSION: 0.2.100
  WASM_BINDGEN_ARCHIVE_SHA256: 63d6a38deb65bd7023c02bdf382ab66b0d2c0241c8582fd3413b5a808b8aeb5b
  WASM_BINDGEN_DIR: ${{ github.workspace }}/.ci-tools/wasm-bindgen

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - name: Check reproducible browser build flags
        run: bash scripts/check-reproducible-rustflags.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo check --release --target wasm32-unknown-unknown --features wasm --lib
      - name: Restore wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WASM_BINDGEN_DIR }}
          key: wasm-bindgen-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_BINDGEN_VERSION }}
      - name: Download wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: |
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          archive="$RUNNER_TEMP/wasm-bindgen-$WASM_BINDGEN_VERSION.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$WASM_BINDGEN_ARCHIVE_SHA256" "$archive" | sha256sum --check
          mkdir -p "$WASM_BINDGEN_DIR"
          tar --extract --gzip --file "$archive" --directory "$WASM_BINDGEN_DIR" --strip-components=1
      - name: Verify wasm-bindgen CLI
        run: |
          echo "$WASM_BINDGEN_DIR" >> "$GITHUB_PATH"
          test "$("$WASM_BINDGEN_DIR/wasm-bindgen" --version)" = "wasm-bindgen $WASM_BINDGEN_VERSION"
      - name: Build browser package
        run: node scripts/build-web-package.mjs
      - name: Smoke-test browser package
        run: node typescript/smoke-test.mjs
      - name: Run native validator against fixture story
        run: >-
          cargo run --quiet --locked --
          --format json tests/fixtures/format-3.3-solve-card-sets/
          > "$RUNNER_TEMP/native-report.json"
      - name: Check native/WASM parity
        run: >-
          node scripts/check-wasm-parity.mjs
          tests/fixtures/format-3.3-solve-card-sets pkg
          "$RUNNER_TEMP/native-report.json"
