name: CI

# Manual only (owner direction 2026-09-13): nothing runs on push or PR. Dispatch
# explicitly when a hosted WASM/CI pass is wanted.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WASM_BINDGEN_VERSION: 0.2.100
  WASM_BINDGEN_DIR: ${{ github.workspace }}/.ci-tools/wasm-bindgen

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release-tag gate compares HEAD with its parent and fails closed
          # if that history is unavailable.
          fetch-depth: 2
      - name: Test release-tag gate
        run: bash scripts/test-check-release-tag.sh
      - name: Fetch release tags
        if: github.ref == 'refs/heads/main'
        run: git fetch --force origin 'refs/tags/*:refs/tags/*'
      - name: Require an exact release tag for a version bump on main
        if: github.ref == 'refs/heads/main'
        run: bash scripts/check-release-tag.sh
      - uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - name: Check reproducible browser build flags
        run: bash scripts/check-reproducible-rustflags.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo check --release --target wasm32-unknown-unknown --features wasm --lib
      - name: Restore wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WASM_BINDGEN_DIR }}
          key: wasm-bindgen-cli-source-locked-rust1.80.0-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_BINDGEN_VERSION }}
      - name: Build canonical wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: |
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          # The prebuilt musl distribution produces different WASM bytes even
          # at the same version. Match the author's canonical rebuild gate.
          cargo +1.80.0 install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --root "$WASM_BINDGEN_DIR"
      - name: Verify wasm-bindgen CLI
        run: |
          echo "$WASM_BINDGEN_DIR/bin" >> "$GITHUB_PATH"
          test "$("$WASM_BINDGEN_DIR/bin/wasm-bindgen" --version)" = "wasm-bindgen $WASM_BINDGEN_VERSION"
      - name: Build browser package
        run: node scripts/build-web-package.mjs
      - name: Smoke-test browser package
        run: node typescript/smoke-test.mjs
      - name: Run native validator against fixture story
        run: >-
          cargo run --quiet --locked --
          --format json tests/fixtures/format-3.3-solve-card-sets/
          > "$RUNNER_TEMP/native-report.json"
      - name: Check native/WASM parity
        run: >-
          node scripts/check-wasm-parity.mjs
          tests/fixtures/format-3.3-solve-card-sets pkg
          "$RUNNER_TEMP/native-report.json"
      - name: Upload verified canonical browser package
        uses: actions/upload-artifact@v4
        with:
          name: validator-web-package
          path: pkg/
          if-no-files-found: error
